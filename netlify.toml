# Site statique : aucune compilation.
[build]
  publish = "."
  command = ""

# Relais XML-RPC vers NEOS (port 3333, inaccessible depuis le navigateur)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
